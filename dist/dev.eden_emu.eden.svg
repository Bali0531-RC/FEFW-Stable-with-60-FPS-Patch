<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a52"/>
      <stop offset="0.6" stop-color="#1d1629"/>
      <stop offset="1" stop-color="#120e19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#e0b04a"/>
      <stop offset="1" stop-color="#a87a24"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1fa"/>
      <stop offset="0.5" stop-color="#cfc8de"/>
      <stop offset="0.51" stop-color="#9d94b3"/>
      <stop offset="1" stop-color="#c2bad4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#e0b04a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0b04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.9"/>
  <!-- woven ring: two threads, gold and crimson, crossing over and under -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="262" r="138" stroke="#7a1f3a" stroke-width="22"/>
    <circle cx="256" cy="262" r="138" stroke="url(#gold)" stroke-width="22" stroke-dasharray="72 36" />
    <circle cx="256" cy="262" r="110" stroke="url(#gold)" stroke-width="10" opacity="0.55"/>
  </g>
  <!-- laurel sprigs (Eden) along the bottom of the ring -->
  <g fill="#7cc97f" stroke="#2f6b3a" stroke-width="3">
    <path d="M168 360 c -26 -8 -40 -28 -42 -52 c 24 6 40 26 42 52 z"/>
    <path d="M196 386 c -28 0 -48 -14 -58 -36 c 26 0 46 14 58 36 z"/>
    <path d="M228 400 c -26 8 -50 2 -66 -14 c 24 -8 48 -2 66 14 z"/>
    <path d="M344 360 c 26 -8 40 -28 42 -52 c -24 6 -40 26 -42 52 z"/>

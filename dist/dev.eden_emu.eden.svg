    <path d="M232 180 L280 180 L276 372 L256 436 L236 372 Z" fill="url(#blade)" stroke="#5a5070" stroke-width="4" stroke-linejoin="round"/>
    <rect x="176" y="158" width="160" height="26" rx="13" fill="url(#gold)" stroke="#7a5a1a" stroke-width="4"/>
    <rect x="243" y="96" width="26" height="66" rx="9" fill="#5a2a3a" stroke="#7a5a1a" stroke-width="4"/>
    <circle cx="256" cy="86" r="20" fill="url(#gold)" stroke="#7a5a1a" stroke-width="4"/>
    <circle cx="256" cy="171" r="9" fill="#c0304f"/>
  </g>
